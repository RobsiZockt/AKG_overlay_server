

services:
  node:
    image: node:20
    volumes:
      - ./app:/app
    working_dir: /app
    command: node server.js
    expose:
      - "4000"
    restart: unless-stopped
    networks:
      - app-network


  svelte:
    image: node:20
    volumes:
      - ./appV2:/app
    working_dir: /app
    command: sh -c "npm install && npm run build && node build"
    environment:
      HOST: 0.0.0.0
      PORT: 5173
    expose:
      - "5173"
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./fallback:/usr/share/nginx/fallback
      - ./app/p/img:/usr/p/img
      - ./../../certs:/etc/ssl
    depends_on:
      - node
      - svelte
    networks:
      - app-network

  db:
    image: postgres:alpine
    container_name: pg_database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: empty_db
    expose:
      - "5432"
    volumes:
      - ./pg_db:/var/lib/postgresql
      - ./inits/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935" #RTMP
      - "8888:8888"
      - "8889:8889"
      - "8890:8890/udp" #SRT
      - "8189:8189/udp"
    volumes:
      - ./nginx/mediamtx.yml:/etc/mediamtx.yml:ro
  

networks:
  app-network:
    driver: bridge

