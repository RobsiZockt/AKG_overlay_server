

services:
  node:
    image: node:20
    volumes:
      - ./app:/app
    working_dir: /app
    command: node server.js
    ports:
      - "4000"
    restart: unless-stopped
    networks:
      - app-network
      
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/webroot:/var/www/certbot
      - ./fallback:/usr/share/nginx/nginx
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ./certbot/webroot:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: sh -c "sleep 5 &&
      certbot certonly --webroot --webroot-path=/var/www/certbot
      --email ${EMAIL} --agree-tos --no-eff-email
      -d ${NODE_DOMAIN}"

  db:
    image: postgres:alpine
    container_name: pg_database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: empty_db
    ports:
      - "5432:5432"
    volumes:
      - ./pg_db:/var/lib/postgresql
      - ./inits/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935" #RTMP
      - "8888:8888"
      - "8889:8889"
      - "8890:8890/udp" #SRT
      - "8189:8189/udp"

    volumes:
      - ./nginx/mediamtx.yml:/etc/mediamtx.yml:ro
  


